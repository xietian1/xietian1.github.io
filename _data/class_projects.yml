# Class Projects — outstanding student projects shown at /class-projects/
#
# HOW TO ADD A PROJECT: copy the template at the bottom and edit it.
#   course   : must match a `code` in `courses:` below
#   term     : e.g. "Spring 2026" (projects are grouped by course, then term, newest first)
#   order    : sort key for terms; use YYYY.T (T = 1 Spring, 2 Summer, 3 Fall)
#   team     : optional list of names as students agreed to be shown (get consent first)
#   award    : optional badge, e.g. "Best Project" (award winners are listed first)
#   summary  : optional one or two sentences
#   tags     : optional list of short labels
#   image    : optional thumbnail (put files in /images/class-projects/)
#   pdf      : optional report/slides PDF, opened in the built-in viewer.
#              A URL on https://files.xietian1.com/... (Oracle VM, /srv/files/...)
#              or a file in this repo (/files/class-projects/...)
#   video    : optional demo video (MP4, H.264 + AAC), played in a pop-up player
#   links    : optional extra buttons (label + url)
#
# Courses with no projects are hidden automatically.

courses:
  - code: "CS 4460"
    name: "Introduction to Cybersecurity"
  - code: "CS 5215/6215"
    name: "Computer Network and Security"
  - code: "CS 3100"
    name: "Operating Systems and Concurrency"

projects:
  - title: "Parking Lot System"
    course: "CS 3100"
    term: "Fall 2025"
    order: 2025.3
    video: "https://files.xietian1.com/class-projects/cs3100/parkinglot.mp4"

  - title: "API Limitation"
    course: "CS 3100"
    term: "Fall 2025"
    order: 2025.3
    pdf: "https://files.xietian1.com/class-projects/cs3100/presentation-api-limitation.pdf"

